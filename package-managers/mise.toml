# Mise Package Manager -- Global development tools
# ~/.config/mise/config.toml
# Conda packages are installed individually into isolated prefixes.

[tools]

# ------------------------------------------------------------
# Dotfiles / Package Handling
# ------------------------------------------------------------

"aqua:zyedidia/eget" = "latest"
"github:volllly/rotz" = "latest"

# ------------------------------------------------------------
# Terminal utilities
# ------------------------------------------------------------

"sd" = "latest" # sed alternative 
"jq" = "latest" # json processor
"yq" = "latest" # yaml processor
"fzf" = "latest" # fuzzy finder
"eza" = "latest" # improved ls
"hyperfine" = "latest" # benchmarking tool
"starship" = "latest" # fast prompt
"dua" = "latest" # better du
"fd" = "latest" # better find
"delta" = "latest" # git diff viewer
"carapace" = "latest" # universal completion engine
"lazygit" = "latest" # git TUI
"zoxide" = "latest" # way better cd
"yazi" = "latest" # amazing file manager TUI
"bat" = "latest" # better cat
"btop" = "latest" # process monitor TUI
tealdeer = "latest" # simple help for commands
"aqua:dalance/procs" = "latest" # better ps
"aqua:ouch-org/ouch" = "latest" # universal compression tool
#"moreutils" = "latest"

# ------------------------------------------------------------
# Development tools
# ------------------------------------------------------------

"uv" = "latest"
"tree-sitter" = "latest"
"conda:hayagriva" = "latest"
neovim = "latest"

# ------------------------------------------------------------
# Document, graphics and media utilities
# ------------------------------------------------------------

"typst" = "latest"
"pandoc" = "latest"
"conda:pandoc-crossref" = "latest"
"gem:pandocomatic" = "latest"
"conda:librsvg" = "latest"
"resvg" = "latest"
"poppler" = "latest"
"conda:img2pdf" = "latest"
"yt-dlp" = "latest"

# ------------------------------------------------------------
# Networking, transfer and terminal applications
# ------------------------------------------------------------

"mosh" = "latest"
"aqua:asciinema/asciinema" = "latest"
"rclone" = "latest"
"conda:minio-client" = "latest"
"tssh" = "latest"
"conda:tsshd" = "latest"
"tmux" = "latest"
"conda:tmuxp" = "latest"
"trzsz-go" = "latest"

# ------------------------------------------------------------
# Archive utilities
# ------------------------------------------------------------

"7zip" = "latest"

# ------------------------------------------------------------
# Language runtimes
# Native mise backends, rather than Conda
# ------------------------------------------------------------

rust = "latest"
python = "3.12"
node = "lts"
ruby = "latest"
java = "25"

# Python CLI utility
"pypi:pipx" = "latest"

# ------------------------------------------------------------
# mise settings
# ------------------------------------------------------------

[settings]

# Use conda-forge for all conda: tools
conda.channel = "conda-forge"

# Avoid legacy shell-script plugin backends
disable_backends = ["asdf", "vfox", "ubi"]
